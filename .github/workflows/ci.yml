name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go mod tidy
        run: go mod tidy -diff

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Keep in step with STATICCHECK in the Makefile. v0.6.x is the last
      # release that supports the Go version in go.mod (1.24).
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...
